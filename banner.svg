      <stop offset="1" stop-color="#202a39"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#64748b"/>
