    <circle cx="1019" cy="146" r="64" fill="#ced8e4" fill-opacity=".055" stroke="#d4dce8" stroke-opacity=".29" stroke-width="1.6"/>
    <text x="1019" y="154" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="2.5" fill="#f4f7fb">KNC</text>
    <circle cx="925" cy="62" r="3" fill="#dae2eb" fill-opacity=".43"/>
