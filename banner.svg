    <text x="88" y="136" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="1.2" fill="#f8fafc">KUSHI N C</text>
    <text x="92" y="180" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#dae2ec">Java Development  /  AI &amp; Machine Learning</text>
    <text x="92" y="214" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#b9c7d7">Interested in Cloud Computing</text>
